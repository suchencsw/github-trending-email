name: GitHub Trending Email

on:
  schedule:
    # Beijing time 08:17, with a backup at 08:47.
    - cron: '17 0 * * *'
    - cron: '47 0 * * *'
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Generate a preview without sending email'
        type: boolean
        default: true
      force_send:
        description: 'Send even if a digest was already sent today'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: github-trending-email
  cancel-in-progress: false

jobs:
  daily-digest:
    if: github.event_name == 'workflow_dispatch' || vars.DIGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check daily send state
        id: state
        env:
          PREVIEW_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_only }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send }}
        run: |
          digest_date=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          marker_path=".github/digest-history/${{ github.repository_owner }}/$digest_date.json"
          echo "DIGEST_DATE=$digest_date" >> "$GITHUB_ENV"
          echo "MARKER_PATH=$marker_path" >> "$GITHUB_ENV"
          if [ "$PREVIEW_ONLY" != 'true' ] && [ "$FORCE_SEND" != 'true' ] && [ -f "$marker_path" ]; then
            echo 'Already sent today; skipping the backup run.'
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.state.outputs.run == 'true'
        with:
          node-version: '20'

      - name: Collect trending projects
        if: steps.state.outputs.run == 'true'
        id: trending
        uses: ./
        with:
          languages: ${{ vars.DIGEST_LANGUAGES || '[]' }}
          dateRange: ${{ vars.DIGEST_DATE_RANGE || 'daily' }}
          enableHuggingFace: ${{ vars.ENABLE_HUGGINGFACE || 'true' }}
          enableHackerNews: ${{ vars.ENABLE_HACKER_NEWS || 'true' }}
          enableDevTo: ${{ vars.ENABLE_DEV_TO || 'false' }}
          enableAIPapers: ${{ vars.ENABLE_AI_PAPERS || 'true' }}
          enableIndieRevenue: 'false'
          itemLimit: ${{ vars.DIGEST_ITEM_LIMIT || '10' }}

      - uses: actions/setup-python@v5
        if: steps.state.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Validate collected projects
        if: steps.state.outputs.run == 'true'
        env:
          TRENDING_DATA: ${{ steps.trending.outputs.trendingData }}
        run: python .github/actions/prepare_digest.py --allow-empty

      - name: Select research and engineering projects
        if: steps.state.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/personalize_digest.py
          --input output/trending.json
          --output output/personalized.json
          --state .github/personalization-state.json
          --state-output output/next-personalization-state.json
          --profile config/interests.json

      - name: Install mail dependency
        if: steps.state.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check yagmail

      - name: Render preview or send email
        if: steps.state.outputs.run == 'true'
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_SSL: ${{ vars.SMTP_SSL || 'true' }}
          SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS || 'false' }}
          EMAIL_SUBJECT: AI科研与工程生产力日报 - ${{ env.DIGEST_DATE }}
          TRENDING_DATA_FILE: output/personalized.json
          PREVIEW_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_only }}
        run: |
          if [ "$PREVIEW_ONLY" = 'true' ]; then
            python .github/actions/send_email.py --dry-run
          else
            python .github/actions/send_email.py
          fi

      - name: Save preview
        if: steps.state.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && inputs.preview_only
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: |
            output/digest-preview.html
            output/personalized.json
          retention-days: 7
          if-no-files-found: error

      - name: Save successful send state
        if: steps.state.outputs.run == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.preview_only)
        env:
          DIGEST_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          marker = Path(os.environ['MARKER_PATH'])
          marker.parent.mkdir(parents=True, exist_ok=True)
          marker.write_text(json.dumps({
              'date': os.environ['DIGEST_DATE'],
              'sent_at': datetime.now(timezone.utc).isoformat(),
              'run_id': os.environ['DIGEST_RUN_ID'],
          }, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp output/next-personalization-state.json .github/personalization-state.json
          git add "$MARKER_PATH" .github/personalization-state.json
          git commit -m "Record digest sent for $DIGEST_DATE"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push
